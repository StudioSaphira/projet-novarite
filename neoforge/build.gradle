plugins {
    id 'net.neoforged.moddev' version '2.0.141'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(
                rootProject.java_version as int
        )
    }
}

neoForge {
    version = rootProject.neoforge_version

    runs {
        client {
            client()
        }

        server {
            server()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        novarite {
            sourceSet sourceSets.main
            sourceSet project(':common').sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':common')
}


dependencies {
    implementation("net.saphyra:saphyra-neoforge-${rootProject.minecraft_version}:${rootProject.saphyra_version}") {transitive = false}
    implementation("net.orevia:orevia-neoforge-${rootProject.minecraft_version}:${rootProject.orevia_version}") {transitive = false}
}


// Loader artifacts include Novarite Common; dependencies remain separate mods.
tasks.named('jar') {
    from(project(':common').sourceSets.main.output)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

def publicationVersion = project.version.toString()
tasks.named('processResources') {
    inputs.property('version', publicationVersion)
    filesMatching(['fabric.mod.json', 'META-INF/neoforge.mods.toml']) {
        expand(version: publicationVersion)
    }
}
